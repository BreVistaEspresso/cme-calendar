<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brevista CME Calendar</title>
<meta name="description" content="A verified calendar of upcoming CME conferences worldwide. Search, filter and export to your calendar.">
<meta name="theme-color" content="#34195F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CME Calendar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/pjs-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/stage.webp" as="image" type="image/webp">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div></div>
<div class="app">
  <header class="hero">
    <img class="hero-img" src="img/stage.webp" width="1000" height="545" alt="" fetchpriority="high" decoding="async">
    <div class="hero-shade"></div>
    <div class="hero-top">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M17 31C10 25 8 17 11 8c4 3 6 8 6 13z" fill="#CDBDEC"/><path d="M17 31c7-6 9-14 6-23-4 3-6 8-6 13z" fill="#fff"/><path d="M6 16c4 0 7 3 8 8-4 0-7-3-8-8z" fill="#CDBDEC" opacity=".8"/></svg>
        Brevista
      </div>
      <button class="round-glass" id="heroSearch" type="button" aria-label="Go to search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    </div>
    <div class="hero-copy">
      <h1>CME Calendar</h1>
      <p>Discover. Plan. Stay Ahead.</p>
    </div>
  </header>

  <main>
    <div class="search-wrap" role="search">
      <label for="q" class="sr">Search conferences, societies, cities and specialties</label>
      <div class="search" id="searchBox">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34195F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search conferences, societies...">
        <button class="clear" id="clearQ" type="button" aria-label="Clear search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34195F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="up-head">
      <h2 id="upHead">Upcoming Conferences</h2>
      <button class="linkbtn" id="viewAll" type="button">View All <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34195F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <p class="summary" id="summary" aria-live="polite"></p>

    <div class="months" id="months" aria-labelledby="upHead"></div>

    <div class="export-wrap">
      <button class="export" id="export" type="button">
        <span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><b id="exportLabel" style="font-weight:600">Export to calendar (.ics)</b></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>

<dialog class="sheet" id="filterSheet" aria-labelledby="fsTitle">
  <div class="s-head"><h3 id="fsTitle">Filter</h3><button class="s-close" type="button" id="fsClose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34195F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <input class="s-find" id="fsFind" type="search" placeholder="Type to narrow the list" aria-label="Narrow the list" autocomplete="off" hidden>
  <ul class="s-list" id="fsList"></ul>
</dialog>

<dialog class="sheet" id="detailSheet" aria-labelledby="dsTitle">
  <div class="s-head"><h3>Conference details</h3><button class="s-close" type="button" id="dsClose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34195F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="d-body" id="dsBody"></div>
</dialog>

<noscript><p style="padding:24px;font-family:sans-serif">This calendar needs JavaScript to run.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
